name: hermes-phone-control
version: "0.23.1"
description: "Voice-driven control of a paired Android phone through Hermes: spoken requests run through the existing conversation, permitted accessibility actions are executed and re-observed, and the verified result is spoken back. Android/Termux companion app required; same-device loopback transport only."
author: ko_spell
kind: standalone
requires_hermes: ">=0.21.4"
platforms:
  - linux
provides_tools:
  - phone_status
  - phone_observe
  - phone_act
  - phone_run_plan
  - phone_profiles
  - voice_draft
  - voice_progress
  - phone_speech
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_llm_call
  - pre_api_request
  - on_session_end
provides_middleware:
  - llm_request
  - tool_execution
provides_commands:
  - voicelink
  - phone_setup
  - phone-setup
  - phone_pairing
  - phone-pairing
  - phone-speech
  - phone_speech
  - phone-execution
  - phone_execution
  - voicefix
config_schema:
  voice_enabled:
    type: bool
    default: false
    description: Start the loopback voice bridge when the gateway starts. Off by default; the pairing secret is never stored in plugin config.
  control_enabled:
    type: bool
    default: false
    description: Allow the paired accessibility tools to act. The companion app must also grant its own control consent.
  connection_file:
    type: str
    default: ""
    description: Path of the private pairing file imported from the companion app (written by /phone_setup import). The file itself holds the device token; this setting holds only its path.
  session_key:
    type: str
    default: ""
    description: Gateway session route that voice requests join (for example agent:main:telegram:dm:<chat>). Leave empty for a local CLI session. Gateway delivery also needs plugins.entries.hermes-phone-control.allow_gateway_injection true.
  locale:
    type: str
    choices: [en, ko, ja, zh-cn, de, es, fr, pt-br, hi, id, th, vi]
    default: en
    description: Language of command replies, spoken status lines and voice-turn guidance. Korean is a full translation; ja, zh-cn, de, es, fr, pt-br, hi, id, th and vi translate the spoken status lines and use English elsewhere.
  stt_model:
    type: str
    default: on-device-ko
    description: Model id for the on-device Android recognizer used for speech-to-text.
  stt_language:
    type: str
    default: auto
    description: Kept for compatibility. The phone always recognizes speech in the companion app's language, so any value here is ignored.
  voice_bind_port:
    type: int
    default: 5001
    description: Loopback port of the voice bridge (0 picks a free port). The bind address is always 127.0.0.1.
  timeout_seconds:
    type: float
    default: 5.0
    description: Timeout for one request to the companion app's loopback control service.
  voice_documents:
    type: dict
    default: {}
    description: Optional alias-to-path allow-list of existing text documents the voice route may read.
  learning_enabled:
    type: bool
    default: true
    description: Keep a local, content-free record of which phone action plans succeeded, to propose reusable profiles.
  distribution_audience:
    type: str
    choices: [family, external]
    default: family
    description: Deployment audience fence for speech settings.
capabilities: []
